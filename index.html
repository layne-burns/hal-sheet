<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hal Briarshade — Paladin 4</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0D11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hal">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">

<style>
/* ==========================================================
   CYBERPUNK TACTICAL HUD — D&D 2024 character sheet
   Fonts are system-stack only so the app works fully offline.
   ========================================================== */
:root{
  --bg:#0A0D11; --panel:#11161C; --panel2:#161D25; --panel3:#1B242E;
  --line:#22303C; --line2:#2E4152;
  --txt:#D7E3ED; --dim:#6F8496; --dimmer:#4A5C6B;
  --yel:#FCEE0A; --cyan:#00E5FF; --mag:#FF003C; --grn:#37E6A8; --violet:#C084FC;
  --m:ui-monospace,"SF Mono",Menlo,Monaco,"Cascadia Mono",monospace;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--txt);font-family:var(--f);font-size:20px;line-height:1.4;
  -webkit-text-size-adjust:100%;overscroll-behavior:none;
  background-image:repeating-linear-gradient(0deg,rgba(0,229,255,.02) 0 1px,transparent 1px 3px);
  padding:10px;padding-top:max(10px,env(safe-area-inset-top));
  padding-bottom:max(10px,env(safe-area-inset-bottom));
}
.cut{clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
.cutsm{clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
.mono{font-family:var(--m)}
.lbl{font-family:var(--m);font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.hide{display:none!important}
a{color:var(--txt);text-decoration:none;border-bottom:1px dotted var(--dimmer)}
a:hover,a:active{color:var(--cyan);border-color:var(--cyan)}
button{font-family:var(--f);cursor:pointer;color:inherit;background:none;border:none}
input,select,textarea{font-family:var(--m);background:var(--panel2);border:1px solid var(--line2);
  color:var(--txt);padding:7px 10px;font-size:18px;border-radius:0}
/* A select sizes itself to its widest option, which is how one long
   option label can push a whole panel into horizontal scroll. Never let
   a control be wider than what holds it. */
input,select,textarea{max-width:100%}
select{text-overflow:ellipsis}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cyan)}
input[type=number]{width:88px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line2)}
::-webkit-scrollbar-track{background:var(--panel)}

/* ---------- TOP BAR ---------- */
.bar{background:var(--panel);border:1px solid var(--line);padding:8px 13px;display:flex;
  align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:7px;position:relative}
.bar::before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:var(--yel)}
.portrait{position:relative;width:66px;height:70px;flex:none;padding:0;border:1px solid var(--line2);
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);overflow:hidden}
.portrait:hover,.portrait:active{border-color:var(--cyan)}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 15%;display:block}
.portrait .pstate{position:absolute;left:0;right:0;bottom:0;background:rgba(5,8,11,.82);
  font-family:var(--m);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--cyan);
  padding:2px 0;text-align:center}
/* Wiki is a small, quiet, deliberately secondary control */
.wikibtn{font-family:var(--m);font-size:14px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dimmer);border:1px solid var(--line);padding:2px 7px;margin-left:7px;background:transparent}
.wikibtn:hover,.wikibtn:active{color:var(--cyan);border-color:var(--cyan)}
.namebtn{background:none;border:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.namebtn:hover,.namebtn:active{color:var(--cyan)}
.namebtn.dim{color:var(--dimmer)}
.namebtn.dim:hover,.namebtn.dim:active{color:var(--mag)}
.nm{font-size:25px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--yel);line-height:1.05}
.nmsub{font-family:var(--m);font-size:14.5px;color:var(--dim);letter-spacing:.09em;margin-top:3px}
.v{cursor:pointer}
.v .n{font-family:var(--m);font-size:27px;line-height:1;font-variant-numeric:tabular-nums}
.v .n small{font-size:17px;color:var(--dim)}
.v .n .tmp{color:var(--cyan)}
.hpwrap{min-width:128px}
.hpbar{height:5px;background:#1E2A34;margin-top:5px;position:relative;overflow:hidden}
.hpfill{height:100%;background:var(--grn);transition:width .18s}
.hpfill.hurt{background:var(--yel)} .hpfill.crit{background:var(--mag)}
.sp{flex:1}
.tg{font-family:var(--m);font-size:14.5px;letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;
  border:1px solid var(--line2);color:var(--dim);background:transparent}
.tg.on{background:var(--cyan);border-color:var(--cyan);color:#04141A}
.tg.on.y{background:var(--yel);border-color:var(--yel);color:#141200}
.bt{font-family:var(--m);font-size:14.5px;letter-spacing:.1em;text-transform:uppercase;padding:6px 11px;
  background:var(--panel2);border:1px solid var(--line2);color:var(--txt)}
.bt:hover{border-color:var(--cyan);color:var(--cyan)}
.bt.dg{border-color:var(--mag);color:var(--mag)}
.bt.pri{border-color:var(--yel);color:var(--yel)}
.bt.dim{border-color:var(--line);color:var(--dimmer);opacity:.55}
.bt.dim:hover{border-color:var(--mag);color:var(--mag);opacity:1}

.bt k{color:var(--dimmer);margin-left:5px;font-size:13.5px;font-style:normal}

/* ---------- CONDITION STRIP / DEATH SAVES ---------- */
.strip{background:var(--panel);border:1px solid var(--line);padding:6px 13px;margin-bottom:7px;
  display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.strip.death{background:var(--mag);border-color:var(--mag);color:#fff}
.strip.death .lbl{color:rgba(255,255,255,.8)}
.cond{font-family:var(--m);font-size:14.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 9px;border:1px solid var(--violet);color:var(--violet)}
.cond .x{margin-left:7px;color:var(--dimmer)}
.ds{display:flex;gap:4px;align-items:center}
.dsp{width:18px;height:18px;border:1px solid #fff;background:transparent}
.dsp.on{background:#fff}
.dsp.f.on{background:#141200;border-color:#141200}

/* ---------- TABS ---------- */
.tabs{display:flex;gap:3px;margin-bottom:7px;flex-wrap:wrap}
.tab{font-family:var(--m);font-size:15px;letter-spacing:.14em;text-transform:uppercase;padding:9px 19px;
  background:var(--panel);border:1px solid var(--line);border-bottom:none;color:var(--dim);
  clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px)}
.tab[aria-selected=true]{background:var(--panel2);color:var(--yel);border-color:var(--line2);
  box-shadow:inset 0 2px 0 var(--yel)}
.tab k{color:var(--dimmer);margin-left:6px;font-size:13.5px;font-style:normal}

/* ---------- LAYOUT ---------- */
/* The stats column carries four numbers per row now that saves sit beside
   the abilities they come from, so it takes 240. The resources column pays
   for it: it dropped to 250 when the duplicate spell list left it, and all
   it holds now are pools and pip rows. Net effect on the centre column is
   nothing. */
.wrap{display:grid;grid-template-columns:240px minmax(0,1fr) 250px;gap:7px;align-items:start}
.wrap.railoff{grid-template-columns:240px minmax(0,1fr) 32px}
.wrap.leftoff{grid-template-columns:32px minmax(0,1fr) 250px}
.wrap.leftoff.railoff{grid-template-columns:32px minmax(0,1fr) 32px}
.pnl{background:var(--panel);border:1px solid var(--line);padding:11px 13px;margin-bottom:7px}
.pnl>h3{font-family:var(--m);font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);
  margin-bottom:8px;font-weight:400;display:flex;align-items:center;gap:9px;
  /* A long heading in a narrow column used to shove the fold chip onto a
     line of its own. The heading text shrinks and ellipsises instead; the
     chip is the control, so it is the thing that must never move.
     nowrap is needed twice over: once so the flex row doesn't break
     between items, and once so the bare title text — an anonymous flex
     item, which no selector can reach — doesn't break inside itself. The
     count beside it absorbs the shrinking. */
  flex-wrap:nowrap;white-space:nowrap;min-width:0}
.pnl>h3::after{content:"";flex:1 1 0;min-width:0;height:1px;background:var(--line)}
.pnl>h3 .cnt{color:var(--dimmer);flex:0 1 auto;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}

/* ---------- ABILITY / SAVE / SKILL ROWS ---------- */
.row{display:flex;justify-content:space-between;align-items:center;font-family:var(--m);font-size:17px;
  padding:4px 0;border-bottom:1px solid #1A242D;cursor:pointer}
.row:last-child{border-bottom:none}
.row:hover{color:var(--cyan)}
.row.prof{color:var(--yel)}
.row.prof:hover{color:var(--cyan)}
.row.unprof{color:var(--dim)}
.row.unprof:hover{color:var(--cyan)}
.row .sc{color:var(--dim);font-size:15.5px}
.row .adv{color:var(--grn);font-size:13.5px;letter-spacing:.06em}
/* A skill label wraps under itself, not under its bullet. The bullet used
   to be an inline element inside the same box as the text, so the second
   line of "Animal Handling" returned to the box edge and sat beneath the
   dot. Making the label a flex box puts the dot and the text in separate
   boxes, and the text wraps within its own. */
.row>span:first-child{display:flex;align-items:flex-start;gap:7px;min-width:0}
.row>span:first-child .dot{flex:none;margin-top:.45em}
.row>span:last-child{flex:none;text-align:right}

/* ---------- ABILITIES + SAVES ----------
   Four columns: which ability, its score, its modifier, the save it feeds.
   Fixed widths on the numbers so the six rows read as a table and the
   signs line up under each other. */
.abrow{display:grid;grid-template-columns:1fr 26px 38px 52px;gap:6px;align-items:center;
  font-family:var(--m);font-size:17px;padding:4px 0;border-bottom:1px solid #1A242D}
.abrow:last-child{border-bottom:none}
.abrow>span:not(.abk){text-align:right;font-variant-numeric:tabular-nums}
.abrow .abk{letter-spacing:.06em}
.abrow .absc{color:var(--dim);font-size:15.5px;cursor:pointer}
.abrow .abmod{cursor:pointer}
.abrow .absv{cursor:pointer;display:flex;align-items:center;justify-content:flex-end;gap:5px}
.abrow .absv.prof{color:var(--yel)}
.abrow .absv:hover,.abrow .abmod:hover,.abrow .absc:hover{color:var(--cyan)}
.abrow .absv .adv{color:var(--grn);font-size:12px;letter-spacing:.04em}
.abrow input{width:100%;text-align:right}
/* The caption row is a label, not a control. */
.abrow.abhead{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dimmer);
  padding:0 0 4px;border-bottom:1px solid var(--line)}
/* Ability heading above each block of skills it governs. */
.grp{font-family:var(--m);font-size:13px;letter-spacing:.16em;color:var(--dimmer);
  margin:9px 0 2px;display:flex;align-items:center;gap:7px}
.grp:first-child{margin-top:0}
.grp::after{content:"";flex:1;height:1px;background:#1A242D}
.dot{display:inline-block;width:5px;height:5px;background:var(--yel);margin-right:6px;vertical-align:1px}
.dot.off{background:var(--line2)} .dot.exp{background:var(--cyan)}

/* ---------- PROVENANCE ---------- */
.prov{margin-top:8px;background:#0C1218;border:1px solid var(--cyan);padding:9px 11px;font-family:var(--m);font-size:15.5px}
.prov .ph{color:var(--cyan);font-size:13.5px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px;
  display:flex;justify-content:space-between}
.prov .ph .x{color:var(--dim)}
.prov .pr{display:flex;justify-content:space-between;padding:2px 0;color:var(--dim);gap:10px}
.prov .pr b{color:var(--txt);font-weight:400;flex:none}
.prov .pr.k-level b{color:var(--yel)}
.prov .pr.k-feat b,.prov .pr.k-feat{color:var(--violet)}
.prov .pr.k-feature b{color:var(--grn)}
.prov .pr.k-imported{color:var(--dimmer)}
.prov .tot{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);display:flex;
  justify-content:space-between;color:var(--txt)}
.prov .tot b{color:var(--cyan)}
.kbadge{font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:1px 5px;border:1px solid currentColor;
  margin-left:6px;opacity:.75}

/* ---------- ATTACK BLOCK ---------- */
.atk{display:grid;grid-template-columns:28px 1fr 64px 96px 1.15fr;gap:11px;align-items:center;
  padding:8px 0;border-bottom:1px solid #1A242D}
.atk.off{opacity:.45}
.atk .stp{width:28px;height:28px;background:var(--yel);color:#141200;font-family:var(--m);font-size:15.5px;
  display:grid;place-items:center}
.atk .stp.g{background:var(--line2);color:var(--txt)}
.atk .wn{font-size:20px;font-weight:600;letter-spacing:.02em}
.atk .nu{font-family:var(--m);font-size:19px;cursor:pointer;font-variant-numeric:tabular-nums}
.atk .nu:hover{color:var(--cyan)}
.atk .ms{font-family:var(--m);font-size:14.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--grn);cursor:pointer}
.atk.off .ms{color:var(--dimmer);text-decoration:line-through}
.bdg{font-family:var(--m);font-size:12px;letter-spacing:.1em;padding:2px 7px;border:1px solid var(--dimmer);
  color:var(--dimmer);margin-left:6px;text-transform:uppercase}
.seqnote{font-family:var(--m);font-size:15px;color:var(--dim);margin-top:8px;padding-top:8px;
  border-top:1px solid var(--line);line-height:1.6}
.seqnote b{color:var(--grn);font-weight:400}
.seqnote em{color:var(--dimmer);font-style:normal}

/* ---------- ALERTS ---------- */
.alert{background:var(--mag);color:#fff;padding:11px 14px;display:flex;align-items:center;gap:13px;
  font-family:var(--m);font-size:16px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px;
  flex-wrap:wrap}
.alert b{font-size:28.5px;letter-spacing:.02em}
.alert .sub{opacity:.85;text-transform:none;letter-spacing:0;font-size:15.5px}
.alert .x{margin-left:auto;font-size:20px;padding:0 5px}

/* ---------- FOLLOWERS / SUMMONS ----------
   Each creature type owns a hue, so two summons are never confused for
   one another — the accent drives the card edge, the glyph and the type
   chip, and the same card is used in the rail, in combat, and in the tab. */
.a-cel{--acc:var(--yel)}
.a-fey{--acc:var(--violet)}
.a-fnd{--acc:var(--mag)}
.fol{border:1px solid var(--line);border-left:3px solid var(--acc);background:var(--panel2);
  padding:8px 10px;margin-bottom:7px}
.fol:last-child{margin-bottom:0}
.fol.full{background:var(--panel3)}
.folhead{display:flex;align-items:baseline;gap:8px}
.folglyph{color:var(--acc);font-size:17px;line-height:1;flex:none}
.folname{font-size:19px;letter-spacing:.02em;cursor:pointer;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folname:hover{color:var(--cyan)}
.foltype{font-family:var(--m);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acc);border:1px solid var(--acc);padding:1px 6px;flex:none}
.folsub{font-family:var(--m);font-size:13.5px;color:var(--dim);letter-spacing:.05em;margin-top:3px}
.folhp{display:flex;align-items:center;gap:7px;margin-top:6px}
.folhp .hpbar{flex:1;min-width:40px}
.folnum{font-family:var(--m);font-size:17px;font-variant-numeric:tabular-nums}
.folnum small{color:var(--dim);font-size:13px}
.folhp .tmp{font-family:var(--m);font-size:14px;color:var(--grn)}
.folatk{font-family:var(--m);font-size:14.5px;color:var(--txt);margin-top:5px;letter-spacing:.03em}
.folacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;align-items:center}
.chip{font-family:var(--m);font-size:13px;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--acc,var(--line2));color:var(--acc,var(--dim));padding:2px 8px;cursor:pointer}
.chip.used{border-color:var(--line2);color:var(--dimmer);text-decoration:line-through}

/* Stat block, printed in the order the source prints it. */
.sb{margin-top:11px;border-top:1px solid var(--line);padding-top:9px}
.sbrow{display:flex;align-items:baseline;gap:9px;font-family:var(--m);font-size:15.5px;
  padding:3px 0;border-bottom:1px solid #1A242D}
.sbrow:last-child{border-bottom:none}
.sbrow>span:first-child{color:var(--dim);width:150px;flex:none}
.sbrow b{color:var(--txt);font-weight:400}
.sbwhy{color:var(--dimmer);font-size:13.5px;margin-left:auto;text-align:right}
.sbabil{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}
.sbab{background:var(--panel2);border:1px solid var(--line);padding:6px 4px;text-align:center}
.sbab b{display:block;font-family:var(--m);font-size:19px;font-weight:400;margin:2px 0}
.sbab .sbwhy{margin:0;text-align:center;display:block;font-size:12.5px}
.sbsec{margin-top:12px}
.sbk{display:block;font-family:var(--m);font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--cyan);margin:14px 0 6px}
.sbsec .sbk{margin-top:0}
.modal .pick.a-cel,.modal .pick.a-fey,.modal .pick.a-fnd{border-left:3px solid var(--acc)}
.modal .pick .pm b{color:var(--acc,var(--cyan));font-weight:400}

/* Table notes — advice, not rules. Cyan is the app's voice for "the
   sheet is telling you something", and the badge keeps it honest. */
.advice{display:flex;flex-direction:column;gap:3px;border-left:2px solid var(--line2);
  padding:7px 0 7px 10px;margin:0 0 12px}
.advk{font-family:var(--m);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.advt{font-size:17px;color:var(--txt);line-height:1.5}
.advfix{display:block;margin-top:6px;font-style:normal;font-size:15.5px;color:var(--dimmer);
  line-height:1.5}
.modal .advice{border-left-color:var(--cyan)}

/* Rules quoted from the source, one lookup per line. */
.ruleline{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid #1A242D;align-items:baseline}
.ruleline:last-child{border-bottom:none}
.ruleline .rn{font-family:var(--m);font-size:14px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--cyan);width:186px;flex:none}
.ruleline .rt{font-size:18px;color:var(--dim);line-height:1.5}
.ruleline.yes .rn{color:var(--grn)}
.ruleline.no .rn{color:var(--dimmer)}
.ruleline.no .rt{color:var(--dimmer)}

/* Per-panel collapse, remembered per tab. */
/* The rails' own collapse control is a different action — it folds the
   whole column, not one panel — but it reads as the same kind of thing,
   so it wears the same chip. */
.pcol,h3.collapse .chev{font-family:var(--m);font-size:14px;letter-spacing:.1em;color:var(--dim);
  border:1px solid var(--line2);padding:1px 8px;flex:none;cursor:pointer;white-space:nowrap}
.pcol:hover,h3.collapse:hover .chev,h3.collapse:active .chev{color:var(--cyan);border-color:var(--cyan)}
.pnl.folded>*:not(h3){display:none}
.pnl.folded>h3{margin-bottom:0}
/* The middle state of a three-way panel: still open, showing only the rows
   that matter most. Which rows those are is the panel's business — it marks
   them — so one rule covers Skills, Conditions and locked features alike. */
.pnl.condensed .cnd-hide{display:none}
/* The mirror of cnd-hide: only shown once a panel is condensed. Used for
   the counts beside a group heading, so "Action 15" doesn't sit above
   eight cards the moment the basics are folded away. */
.cnd-show{display:none}
.pnl.condensed .cnd-show{display:inline}

/* ---------- REMINDERS ----------
   Lives under the alert bar on every tab. Violet = the world's holidays,
   yellow = something you wrote down yourself. */
.remind{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--yel);
  padding:9px 13px;margin-bottom:7px}
.rmrow{display:flex;align-items:center;gap:11px;padding:5px 0;border-bottom:1px solid #1A242D}
.rmrow:last-child{border-bottom:none}
.rmflag{font-size:19px;color:var(--yel);flex:none;line-height:1}
.rmrow.hol .rmflag{color:var(--violet)}
.rmname{flex:1;font-size:19px;cursor:pointer;min-width:0}
.rmname:hover{color:var(--cyan)}
/* On the same line as the title, not under it. There is always horizontal
   room for a date, and stacking it doubled the height of the loudest strip
   on the page. */
.rmwhen{display:inline;margin-left:9px;font-family:var(--m);font-size:14.5px;
  color:var(--dim);letter-spacing:.06em}
.rmmore,.rmall{font-family:var(--m);font-size:14px;color:var(--dimmer);letter-spacing:.08em;
  margin-top:7px}
.rmall{margin-top:8px}
.rmsoon{font-family:var(--m);font-size:15px;color:var(--dim);margin-top:7px;padding-top:7px;
  border-top:1px solid #1A242D;cursor:pointer}
.rmsoon:hover{color:var(--cyan)}
.rmsoon b{color:var(--txt);font-weight:400}

/* ---------- CALENDAR BROWSER ---------- */
/* Sits after the h3's hairline rule, same as every other panel button. */
.calviews{display:flex;gap:5px;flex:none}
/* Two headings carry a cluster of controls that has to stay whole — the
   calendar's view switch and the map's zoom — so those are allowed to
   wrap and to break their title text. This used to apply to every
   heading, which meant a long source citation or a wide count could push
   the fold chip onto a line of its own anywhere in the app. */
.pnl>h3.headwrap{flex-wrap:wrap;white-space:normal}
.calnav{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:10px}
/* The jump row is the one place two bare labels sit side by side, and
   .mrow's gap is scoped to modals — so it lays itself out. */
.caljump{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.caljump .lbl,.caljump .cjk{flex:none}
.cjk{font-family:var(--m);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer)}
.calaway{font-family:var(--m);font-size:14px;letter-spacing:.06em;color:var(--yel);
  display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.calgrid{font-family:var(--m)}
.cghead,.cgrow{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cghead{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer);
  margin-bottom:4px}
.cghead span{padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cgrow{margin-bottom:3px}
.cgcell{position:relative;min-height:52px;background:var(--panel2);border:1px solid var(--line);
  padding:4px 5px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}
.cgcell.empty{background:transparent;border-color:transparent;cursor:default}
.cgcell:hover{border-color:var(--cyan)}
.cgcell.empty:hover{border-color:transparent}
.cgnum{font-size:16px;color:var(--dim);font-variant-numeric:tabular-nums}
.cgcell.sel{border-color:var(--cyan)}
.cgcell.sel .cgnum{color:var(--cyan)}
.cgcell.today{background:var(--panel3);border-color:var(--yel)}
.cgcell.today .cgnum{color:var(--yel)}
.dmarks{display:flex;gap:3px}
.dm{width:6px;height:6px;background:var(--yel);display:block}
.dm.hol{background:var(--violet)}

.calweek .wkday{border-bottom:1px solid #1A242D;padding:7px 0;cursor:pointer}
.calweek .wkday:last-child{border-bottom:none}
.calweek .wkday:hover .wkname{color:var(--cyan)}
.calweek .wkday.sel{border-left:2px solid var(--cyan);padding-left:9px}
.calweek .wkday.today{border-left:2px solid var(--yel);padding-left:9px}
.wkhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-family:var(--m)}
.wkname{font-size:17px}
.wkday.today .wkname{color:var(--yel)}
.wkdate{font-size:15px;color:var(--dim)}
.wkitems{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.wkitem{font-family:var(--m);font-size:14.5px;color:var(--yel);border:1px solid var(--line2);
  padding:1px 8px}
.wkitem.hol{color:var(--violet);border-color:var(--violet)}
.wkitem b{color:var(--dim);font-weight:400}

/* ---------- DAY PAGE ---------- */
.dayp{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.dayphead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.dayptitle{font-family:var(--m);font-size:19px;color:var(--cyan);letter-spacing:.04em}
.daypalt{font-family:var(--m);font-size:14.5px;color:var(--dim)}
.daynotes{margin-top:9px}
.daynote{display:flex;align-items:center;gap:11px;padding:5px 0;border-bottom:1px solid #1A242D}
.daynote:last-child{border-bottom:none}
.dnwhen{font-family:var(--m);font-size:13.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--yel);width:92px;flex:none}
.dntitle{flex:1;font-size:18.5px;min-width:0}
.dnmeta{font-family:var(--m);font-size:13.5px;color:var(--dimmer);letter-spacing:.06em}
.daynote .x{font-size:19px;padding:0 5px;color:var(--dim)}
.daynote .x:hover{color:var(--mag)}
.daypadd{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:11px;
  padding-top:10px;border-top:1px solid #1A242D}
.daypadd input[type=text]{flex:1;min-width:180px}
.daypadd select{font-size:16px;padding:6px 8px}

/* ---------- MAP ----------
   The map is a photograph of pencil on paper — nearly white — dropped
   into a very dark app. Inverting it outright would read as a negative,
   so instead it is darkened and tinted toward the panel colour, which
   keeps the drawing's own tones and lets the pins sit on top as the
   only saturated thing on screen. */
.mapview{position:relative;overflow:hidden;background:var(--panel2);
  border:1px solid var(--line2);aspect-ratio:1138/897;touch-action:none;
  cursor:grab;user-select:none;-webkit-user-select:none}
.mapview:active{cursor:grabbing}
.mapstage{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
.mapimg{width:100%;display:block;pointer-events:none;
  filter:invert(1) hue-rotate(180deg) saturate(.35) brightness(.92) contrast(1.15)}
.mapmodes{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:9px}

/* The legend IS the filter, so each entry carries the actual pin it
   switches — you match the swatch to the map rather than reading a
   colour key and translating. Off reads as genuinely off: the swatch
   goes grey and the text dims, no relying on the border alone. */
.maplegend{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:9px}
.lgd{display:flex;align-items:center;gap:6px;font-family:var(--m);font-size:13px;
  letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;
  border:1px solid var(--line2);color:var(--dimmer);background:transparent}
.lgd .mdot{width:8px;height:8px;background:var(--line2);flex:none;display:block}
.lgd b{font-weight:400;color:var(--dimmer);font-size:12px}
.lgd.on{color:var(--txt);border-color:var(--line2)}
.lgd.on b{color:var(--dim)}
.lgd[disabled]{opacity:.35}
.lgd.on.g-cities .mdot{background:transparent;border:2px solid var(--cyan);
  border-radius:50%;width:11px;height:11px}
.lgd.on.g-towns .mdot{background:var(--cyan)}
.lgd.on.g-ruins .mdot{background:var(--mag)}
.lgd.on.g-wilds .mdot{background:var(--dim)}
.lgd.on.g-routes .mdot{background:var(--mag)}
.lgd.on.g-mine .mdot{background:var(--violet)}
.lgd.on:hover,.lgd:hover{border-color:var(--cyan);color:var(--cyan)}

/* Each pin cancels the stage's scale, so it stays the same size on
   screen however far in you zoom. --z is set on the stage. */
.mpin{position:absolute;padding:0;background:none;border:none;
  transform:translate(-50%,-50%) scale(calc(1 / var(--z,1)));
  transform-origin:50% 50%;display:flex;flex-direction:column;align-items:center;
  gap:2px;z-index:2}
.mpin .mdot{width:9px;height:9px;background:var(--cyan);display:block;
  border:1px solid #04141A;box-shadow:0 0 0 1px var(--cyan)}
.mpin .mlab{font-family:var(--m);font-size:11px;letter-spacing:.06em;color:var(--txt);
  background:rgba(5,8,11,.82);padding:0 4px;white-space:nowrap;max-width:150px;
  overflow:hidden;text-overflow:ellipsis}
/* The scan already letters its own geography — ranges, forests, moors,
   the wall — and printing our labels over the mapmaker's doubles them
   and buries the towns, which are what you actually navigate by. So
   those pins keep the dot and drop the label until you zoom in, where
   there is room for both. The selected pin always says its name. */
.mpin.quiet .mlab{display:none}
.mapstage.zoomed .mpin.quiet .mlab,.mpin.quiet.sel .mlab{display:block}
.mpin:hover{z-index:4}
.mpin:hover .mlab,.mpin.sel .mlab{color:var(--cyan)}
.mpin.sel{z-index:5}
.mpin.sel .mdot{background:var(--yel);box-shadow:0 0 0 1px var(--yel),0 0 9px 2px rgba(252,238,10,.55)}
/* The legend's own vocabulary: a city is the circled dot, a town the
   plain one. Everything the map draws but does not mark reads quieter. */
.mpin.k-city .mdot{width:12px;height:12px;border-radius:50%;background:transparent;
  border:2px solid var(--cyan);box-shadow:0 0 0 1px #04141A}
.mpin.k-city.sel .mdot{border-color:var(--yel);box-shadow:0 0 9px 2px rgba(252,238,10,.55)}
.mpin.k-ruin .mdot,.mpin.k-wall .mdot,.mpin.k-road .mdot{background:var(--mag);
  box-shadow:0 0 0 1px var(--mag)}
.mpin.k-forest .mdot,.mpin.k-swamp .mdot,.mpin.k-hills .mdot,
.mpin.k-mountains .mdot,.mpin.k-sea .mdot,.mpin.k-island .mdot{background:var(--dim);
  box-shadow:0 0 0 1px var(--dim);width:7px;height:7px}
.mpin.k-forest .mlab,.mpin.k-swamp .mlab,.mpin.k-hills .mlab,
.mpin.k-mountains .mlab,.mpin.k-sea .mlab,.mpin.k-island .mlab,
.mpin.k-road .mlab,.mpin.k-wall .mlab{color:var(--dim)}
.mpin.k-warren .mdot{background:var(--grn);box-shadow:0 0 0 1px var(--grn)}
/* Yours, so you can tell at a glance what the book gave you and what
   you added yourself. */
.mpin.own .mdot{background:var(--violet);box-shadow:0 0 0 1px var(--violet)}
.mpin.own .mlab{color:var(--violet)}
/* The party outranks everything and is meant to be found instantly. */
.mpin.party{z-index:6}
.mpin.party .mdot{width:14px;height:14px;background:var(--yel);
  clip-path:polygon(50% 0,100% 100%,0 100%);box-shadow:none;border:none;
  filter:drop-shadow(0 0 5px rgba(252,238,10,.85))}
.mpin.party .mlab{color:var(--yel);border:1px solid var(--yel)}

/* Narrow: the map gets the full width, and labels would crowd it, so they
   shrink rather than being dropped — position still reads. */
body.onecol .mpin .mlab{font-size:10px;max-width:84px}

/* ---------- TAGS ---------- */
/* Three hue families plus gray. Shade carries the distinction
   inside a family, so the eye sorts by meaning first. */
.tag{display:inline-block;font-family:var(--m);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 8px;border:1px solid var(--line2);color:var(--dim);margin:2px 3px 0 0}
.tag.t-c1{border-color:#4A8A94;color:#6BA3AC}
.tag.t-c2{border-color:#3F7A82;color:#5C949C}
.tag.t-c3{border-color:#35626A;color:#4C7880}
.tag.t-m1{border-color:#A85062;color:#C06B7C}
.tag.t-m2{border-color:#94485C;color:#AC6478}
.tag.t-m3{border-color:#7A3C4C;color:#8F5666}
.tag.t-y1{border-color:#A89552;color:#C0AD6C}
.tag.t-y2{border-color:#93824A;color:#AA9860}
.tag.t-y3{border-color:#7A6C3E;color:#8F8054}
.tag.t-y4{border-color:#605440;color:#746654}
.tag.t-g{border-color:#3A4854;color:#7E90A0}
.tag.sel{background:var(--cyan);border-color:var(--cyan);color:#04141A}
/* Two columns: a fixed heading gutter and a cell the tags wrap inside. The
   headings can be any length now without disturbing the rows below them. */
.tagbar{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 10px;align-items:baseline}
.taggrp{font-family:var(--m);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dimmer);text-align:right;white-space:nowrap}
.tagrow{display:flex;flex-wrap:wrap;gap:2px 3px;align-items:center}

/* ---------- EDGE GLOW ---------- */
#glow-root .glow{position:fixed;inset:0;pointer-events:none;z-index:40}
.glow-conc{box-shadow:inset 0 0 60px 6px rgba(0,229,255,.42),inset 0 0 14px 2px rgba(0,229,255,.6);
  animation:pulseC 3.4s ease-in-out infinite}
.glow-low{box-shadow:inset 0 0 60px 6px rgba(255,0,60,.45),inset 0 0 14px 2px rgba(255,0,60,.65);
  animation:pulseR 1.9s ease-in-out infinite}
/* Both: cyan on the outside, red hugged just inside it */
.glow-both{box-shadow:inset 0 0 10px 2px rgba(0,229,255,.75),inset 0 0 34px 10px rgba(255,0,60,.5),
  inset 0 0 70px 22px rgba(255,0,60,.22);animation:pulseB 2.2s ease-in-out infinite}
/* Inspiration: an unspent resource is easy to forget, so this is meant
   to be noticed — a bright gold rim, brighter than the concentration
   cyan, breathing fast enough to catch the eye. It still sits under the
   red low-HP rim, which has to stay the loudest thing on screen. */
.glow-insp{box-shadow:inset 0 0 78px 12px rgba(252,238,10,.40),inset 0 0 20px 3px rgba(252,238,10,.88);
  animation:pulseI 2.4s ease-in-out infinite}
@keyframes pulseC{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes pulseR{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes pulseB{0%,100%{opacity:.78}50%{opacity:1}}
@keyframes pulseI{0%,100%{opacity:.6}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.glow-conc,.glow-low,.glow-both,.glow-insp{animation:none}}

/* ---------- COMBAT BAR ---------- */
.strip.combat{gap:7px;border-color:var(--line2)}
.rnd{font-family:var(--m);font-size:17px;letter-spacing:.12em;text-transform:uppercase;color:var(--yel)}
.ecopip{font-family:var(--m);font-size:15.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:5px 10px;border:1px solid var(--cyan);color:var(--cyan);background:transparent;
  display:flex;flex-direction:column;line-height:1.25}
.ecopip .ecoi{font-size:12px;opacity:.75;letter-spacing:.14em}
.ecopip.used{border-color:var(--line2);color:var(--dimmer);text-decoration:line-through}
.mv{font-family:var(--m);font-size:15.5px;color:var(--dim);display:flex;align-items:center;gap:5px}
.hitflag{font-family:var(--m);font-size:14.5px;letter-spacing:.08em;text-transform:uppercase;
  color:#141200;background:var(--yel);padding:4px 9px}

/* ---------- EFFECTS / CREATURES / PARTY / ORDER / DOABLE ---------- */
.eff{padding:8px 0;border-bottom:1px solid #1A242D;border-left:2px solid var(--line2);padding-left:9px;
  margin-bottom:2px;border-radius:0}
.eff.conc{border-left-color:var(--yel)}
.eff:last-child{border-bottom:none}
.tgt{padding:8px 0;border-bottom:1px solid #1A242D}
.tgt.hit{border-left:2px solid var(--mag);padding-left:7px}
.rowname{width:158px;font-size:18px}
.acinput{width:72px;font-size:18px}
.st-healthy{border-color:var(--grn);color:var(--grn)}
.st-bloodied{border-color:var(--yel);color:var(--yel)}
.st-down{border-color:var(--mag);color:var(--mag)}
.tcond{display:flex;align-items:center;gap:9px;margin-top:5px;flex-wrap:wrap}
.ordrow{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid #1A242D}
.ordrow.cur{background:#001418}
.ordrow .oi{font-family:var(--m);color:var(--dimmer);width:20px;flex:none}
.ordrow .on{flex:1;font-size:18px}
.ordrow .oinit{width:64px;font-size:18px}
/* ---------- CARD ----------
   One shape, used by everything that is "a thing you can do": the doable
   list on Combat and the spell lists on Spells. Name, then its one line of
   meta, then tags, down the left; the controls stacked at the bottom right
   with the action on top and the wiki link under it.

   The meta sits on its own line rather than mid-sentence between the name
   and the buttons. That is the whole trick — it is what makes "Bonus
   action" line up with "Bonus action" three cards down, instead of
   starting wherever the name before it happened to end. */
.card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;
  padding:8px 10px;margin-bottom:5px;background:var(--panel2);border:1px solid var(--line)}
.card:last-child{margin-bottom:0}
.card>.cardname{grid-column:1;grid-row:1;font-size:19px;font-weight:600;text-align:left}
.card>.cardmeta{grid-column:1;grid-row:2;font-family:var(--m);font-size:14px;color:var(--dim);
  letter-spacing:.06em}
.card>.cardtags{grid-column:1;grid-row:3;min-height:1px}
/* Spans all three rows and sits at the bottom, so the controls land in the
   same corner whether or not a card has tags. */
.card>.cardbtns{grid-column:2;grid-row:1/span 3;align-self:end;display:flex;
  flex-direction:column;align-items:stretch;gap:4px;min-width:98px}
.card>.cardbtns .wikibtn{margin-left:0;text-align:center}
.card>.carddetail{grid-column:1/-1;grid-row:4;font-size:17.5px;color:var(--dim);
  line-height:1.45;margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
.card.locked{opacity:.4}
/* The group heading above each run of cards — by action economy on Combat,
   by where the spell came from on Spells. */
.cardgrp{font-family:var(--m);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--cyan);margin:11px 0 5px;display:flex;align-items:center;gap:7px}
.cardgrp::after{content:"";flex:1;height:1px;background:var(--line)}
.cardgrp:first-of-type{margin-top:3px}
.cardgrp .cardgrpn{color:var(--dimmer);flex:none;order:9}
.rollcard{border:1px solid var(--cyan);padding:10px 12px;margin-bottom:7px;background:#0C1218}
.rollcard.them{border-color:var(--mag)}
.rollcard .rw{font-family:var(--m);font-size:13.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--cyan)}
.rollcard.them .rw{color:var(--mag)}
.rollcard .rd{font-family:var(--m);font-size:25px;margin:4px 0 3px}
.rollcard .rwhy{font-size:17.5px;color:var(--dim);line-height:1.45}

/* ---------- ATTACK ROLL MODAL ---------- */
.atkbreak{background:#0C1218;border:1px solid var(--line2);padding:9px 11px;font-family:var(--m);font-size:16px}
.atkbreak .pr{display:flex;justify-content:space-between;padding:2px 0;color:var(--dim)}
.atkbreak .pr b{color:var(--txt);font-weight:400}
.atkbreak .tot{display:flex;justify-content:space-between;margin-top:6px;padding-top:6px;
  border-top:1px solid var(--line2);color:var(--cyan)}
.atkbreak .tot b{font-size:21.5px}
.hitcard{margin-top:11px;padding:11px 13px;display:flex;align-items:center;gap:12px;
  font-family:var(--m);font-size:17.5px}
.hitcard b{font-size:25px;letter-spacing:.06em}
.hitcard.hit{background:var(--grn);color:#04140C}
.hitcard.miss{background:var(--mag);color:#fff}
.dmgblock{margin-top:13px;border-top:1px solid var(--line);padding-top:11px}
.ph2{font-family:var(--m);font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);
  margin-bottom:6px}
.dd{font-family:var(--m);font-size:22.5px}
.vulnrow{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.vpick{font-family:var(--m);font-size:14.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:6px 11px;border:1px solid var(--line2);color:var(--dim);background:transparent}
.vpick.sel{border-color:var(--mag);color:var(--mag)}
/* The grid that lays this out is defined with the tag styles above; only
   the spacing belongs here. It used to say display:flex, which quietly
   beat the grid by being the later rule. */
.tagbar{margin-bottom:9px}
.tagbar .tag{cursor:pointer;margin:0}

/* ---------- ENTRY (spell / feature / item) ---------- */
.entry{padding:9px 0;border-bottom:1px solid #1A242D}
.entry:last-child{border-bottom:none}
.entry .eh{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.entry .en{font-size:20px;font-weight:600}
.entry .emeta{font-family:var(--m);font-size:14.5px;color:var(--dim);letter-spacing:.06em}
.entry .etext{font-size:18.5px;color:var(--dim);margin-top:5px;line-height:1.5}
.entry .esrc{font-family:var(--m);font-size:14px;color:var(--dimmer);letter-spacing:.08em;
  text-transform:uppercase;margin-left:auto}
.entry.locked{opacity:.4}
.hb{font-family:var(--m);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--violet);
  border:1px solid var(--violet);padding:0 5px}

/* ---------- RESOURCE RAIL ---------- */
.rail{position:relative;min-height:44px}
.railtab{position:absolute;left:0;top:0;bottom:0;min-height:220px;width:32px;background:var(--panel2);
  border:1px solid var(--line2);display:none;align-items:center;justify-content:center;cursor:pointer}
.railtab:hover,.railtab:active{border-color:var(--cyan);background:var(--panel3)}
/* Each rail collapses independently — scoped so hiding one never hides the other */
.wrap.railoff .rrail .railtab{display:flex}
.wrap.railoff .rrail .railbody{display:none}
.wrap.leftoff .lrail .railtab{display:flex}
.wrap.leftoff .lrail .railbody{display:none}
.railtab span{writing-mode:vertical-rl;font-family:var(--m);font-size:14px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--cyan);pointer-events:none}
/* Header doubles as the collapse control */
h3.collapse{cursor:pointer;justify-content:space-between}
h3.collapse::after{display:none}
.res{margin-bottom:11px}
.res:last-child{margin-bottom:0}
.rh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.rh .rv{font-family:var(--m);font-size:21.5px;font-variant-numeric:tabular-nums;cursor:pointer}
.rh .rv small{font-size:15.5px;color:var(--dim)}
.pips{display:flex;gap:3px}
.pip{flex:1;height:13px;background:var(--cyan);border:none;min-width:8px}
.pip.sp{background:#1C2731}
.pip.y{background:var(--yel)} .pip.y.sp{background:#2A2800}
/* Lay on Hands is a pool, not a form control. It wears the same rectangles
   as the pip rows beneath it — same height, same empty colour, same cyan —
   so the whole rail reads as one kind of object. One rectangle per five
   points; the partly-spent one fills by fifths, so 16 of 20 is three solid
   blocks and a fifth of a fourth rather than a thumb sitting at 80%. */
.lohbar{display:flex;gap:3px;margin:6px 0 0;touch-action:none;cursor:ew-resize}
.lohbar:focus-visible{outline:1px solid var(--cyan);outline-offset:2px}
.lohseg{flex:1;height:13px;background:#1C2731;overflow:hidden}
.lohseg i{display:block;height:100%;background:var(--cyan)}
.qb{display:flex;gap:4px;margin-top:5px}
/* The buttons are the first thing you should reach for — spending is
   almost always a known number — so they read at full strength rather
   than as the dimmed afterthought they were. */
.qb button{flex:1;font-family:var(--m);font-size:15px;padding:6px 0;background:var(--panel2);
  border:1px solid var(--line2);color:var(--txt);letter-spacing:.06em}
.qb button:hover{border-color:var(--cyan);color:var(--cyan)}

/* ---------- MODAL ---------- */
.mask{position:fixed;inset:0;background:rgba(5,8,11,.86);display:flex;align-items:center;
  justify-content:center;z-index:50;padding:20px}
/* --appvh is the viewport height in the coordinate space the stylesheet
   actually lays out in; render() publishes it. Plain vh is the device
   height, which under zoom is a smaller number — it capped this at 70% of
   the screen and forced scrolling that wasn't necessary. The fallback
   keeps the old behaviour if the variable is ever missing. */
.modal{background:var(--panel);border:1px solid var(--cyan);max-width:640px;width:100%;
  max-height:calc(var(--appvh, 100vh) * 0.9);overflow-y:auto;padding:18px 20px;
  position:relative;overscroll-behavior:contain}
/* The close control sits over the modal's own scroll, so it is reachable
   whatever the content is doing. A modal you can open and not close is
   worse than one you cannot open. */
.modal .mx{position:sticky;top:-18px;float:right;margin:-8px -8px 0 8px;z-index:3;
  width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:22px;line-height:1;background:var(--panel2);border:1px solid var(--line2);
  color:var(--dim);cursor:pointer}
.modal .mx:hover,.modal .mx:active{border-color:var(--mag);color:var(--mag)}
.modal h2{font-family:var(--m);font-size:17px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--yel);margin-bottom:4px;font-weight:400}
.modal .msub{font-family:var(--m);font-size:15px;color:var(--dim);margin-bottom:14px;line-height:1.6}
.modal .mrow{display:flex;gap:9px;align-items:center;margin-bottom:11px;flex-wrap:wrap}
/* Flex items refuse to shrink below their content by default, so a wide
   control overflows the row instead of wrapping. Let them shrink. */
.modal .mrow>input,.modal .mrow>select{min-width:0}
/* Pinned to the bottom of the modal's scroll rather than living at the end
   of it. Done was previously only reachable by scrolling the whole way
   down — and scrolling inside a zoomed overflow container is exactly where
   touch gets unreliable, so on the iPad it could not be reached at all.
   The negative bottom and matching padding let it cover the modal's own
   bottom padding, so content doesn't peek out beneath it. */
.modal .mfoot{display:flex;gap:7px;margin-top:16px;padding:13px 0 18px;
  border-top:1px solid var(--line);flex-wrap:wrap;
  position:sticky;bottom:-18px;background:var(--panel);z-index:2}
.gain{font-family:var(--m);font-size:16px;padding:4px 0;border-bottom:1px solid #1A242D;
  display:flex;gap:9px;align-items:baseline}
.gain .gk{font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:0 5px;border:1px solid currentColor;flex:none}
.gain.k-level{color:var(--yel)} .gain.k-feature{color:var(--grn)}
.gain.k-proficiency{color:var(--cyan)}
.gain.k-note{color:var(--violet)} .gain.k-flag{color:var(--mag)}
.pick{display:block;width:100%;text-align:left;padding:9px 11px;border:1px solid var(--line2);
  background:var(--panel2);margin-bottom:5px}
.pick:hover{border-color:var(--cyan)}
.pick.sel{border-color:var(--yel);background:#1C1A00}
.pick .pn{font-size:19px;font-weight:600}
.pick .pt{font-size:17px;color:var(--dim);margin-top:3px;line-height:1.45}
.pick .pm{font-family:var(--m);font-size:14px;color:var(--dimmer);letter-spacing:.06em;text-transform:uppercase}
.warnbox{border:1px solid var(--yel);background:#1A1800;padding:9px 11px;font-family:var(--m);
  font-size:15.5px;color:var(--yel);line-height:1.6;margin-bottom:12px}

/* ---------- MISC ---------- */
.editon{outline:1px dashed var(--violet);outline-offset:1px}
.edithint{font-family:var(--m);font-size:14.5px;color:var(--violet);letter-spacing:.08em;
  text-transform:uppercase;margin-bottom:8px}
.foot{font-family:var(--m);font-size:14px;color:var(--dimmer);letter-spacing:.08em;margin-top:9px;
  text-transform:uppercase}
.foot b{color:var(--cyan);font-weight:400}
.imp{font-family:var(--m);font-size:15.5px;color:var(--dim);padding:3px 0;line-height:1.5}
.imp::before{content:"› ";color:var(--yel)}
textarea.notes{width:100%;min-height:140px;line-height:1.6;font-family:var(--f);font-size:19px}
.kv{display:flex;justify-content:space-between;font-family:var(--m);font-size:16px;padding:3px 0;
  border-bottom:1px solid #1A242D;gap:12px}
.kv:last-child{border-bottom:none}
.kv span:first-child{color:var(--dim)}
.gridcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 18px}

/* ---------- CALENDAR ---------- */
.calday{font-family:var(--m);font-size:27px;color:var(--yel);letter-spacing:.04em;line-height:1.15}
.calsub{font-family:var(--m);font-size:15.5px;color:var(--dim);letter-spacing:.08em;
  text-transform:uppercase;margin-top:2px}
.calalt{font-family:var(--m);font-size:15.5px;color:var(--dim);margin-top:6px}
.calalt b{color:var(--cyan)}
.calfeast{border-left:2px solid var(--violet);padding-left:9px;margin-top:10px}
.calfeast .cfname{font-family:var(--m);font-size:18.5px;color:var(--violet);
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:3px}
.calmonth{border-bottom:1px solid #1A242D;padding:6px 0}
.calmonth:last-child{border-bottom:none}
.calmonth.now{border-left:2px solid var(--yel);padding-left:9px}
.calmonth .cmhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.calmonth .cmname{font-family:var(--m);font-size:17px}
.calmonth.now .cmname{color:var(--yel)}
.calmonth .cmmeta{font-family:var(--m);font-size:13.5px;color:var(--dimmer);
  letter-spacing:.08em;text-transform:uppercase;flex:none}
.cmfeast{font-family:var(--m);font-size:15.5px;color:var(--dim);padding:2px 0 0 11px}
.cmfeast::before{content:"› ";color:var(--violet)}
.cmfeast.today{color:var(--violet)}

/* ---------- TABLET CHROME COMPACTION ----------
   The iPad in landscape is 1080x740, and the chrome above the content was
   eating 405px of that 740 — 55% of the screen spent on things that do not
   change during a turn. Three separate wraps caused it: the identity block
   claimed 431px of bar width so the buttons fell to a second row, the flex
   spacer then forced a third, and eight tabs overflowed by a few pixels
   into a second row of their own. Below 1200px we tighten all three.

   Keyed off a class rather than a media query, because the sheet is read
   at 80% zoom: the device viewport is 1080px but the layout is 1350px
   wide, and a media query can only see the first number. render() does
   the measuring and sets .compact — see the note there.

   This block still lives at the end of the stylesheet. `body.compact X`
   outranks a bare `X` on specificity, but several of these override rules
   that are themselves compound, so ordering is what keeps it predictable. */
/* The spacer earns its keep on a wide layout, where it separates status
   from actions. Where room is short it costs an entire row of bar to do it. */
body.compact .sp{display:none}
body.compact .bar{gap:9px;padding:7px 11px}
/* Name and lineage never change mid-session, so they yield space first.
   Capped rather than merely shrinkable: the bar wraps instead of shrinking,
   so without a ceiling the identity block keeps its full 387px and pushes
   everything else down a row. The subtitle then truncates — the subclass is
   on the Features tab, and losing its tail costs nothing at the table. */
body.compact .idblk{min-width:0;flex:0 1 auto;max-width:250px}
body.compact .nm{font-size:21px}
body.compact .nmsub{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.compact .v .n{font-size:24px}
/* Eight tabs overflow a narrow bar by a hair. Trimming the horizontal
   padding buys back ~110px and returns them to one row; the keyboard hints
   stay, because there is a keyboard. */
body.compact .tab{padding:8px 11px;letter-spacing:.1em}
/* Reminders stay loud enough to notice, quiet enough to not cost a fifth of
   the viewport. The date rides on the same line as the title instead of
   below it, which is the whole of the height difference. */
body.compact .remind{padding:6px 11px}
body.compact .rmname{font-size:17px}

/* ---------- FEWER COLUMNS ----------
   Both tiers are driven by the class render() sets from the real layout
   width, not by a media query — see the note there. A media query measures
   device pixels, which at this sheet's zoom is a different number from the
   width the stylesheet is actually laying out in.

   TWO COLUMNS (portrait): what you're doing sits beside what you spend,
   and the stats drop to a full-width band underneath, laid out across
   three sub-columns so six abilities and eighteen skills don't become a
   thousand pixels of scrolling. Stats are a reference you consult, so
   below the fold is where they belong. */
body.twocol .wrap{grid-template-columns:minmax(0,1fr) 250px}
body.twocol .wrap.railoff{grid-template-columns:minmax(0,1fr) 32px}
body.twocol .wrap>div:nth-child(2){grid-column:1;grid-row:1}
body.twocol .rrail{grid-column:2;grid-row:1}
body.twocol .lrail{grid-column:1/-1;grid-row:2}
body.twocol .lrail .railbody{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:0 7px;align-items:start}
/* Full width, so its edge tab lies down like the one-column case. */
body.twocol .wrap.leftoff .lrail .railtab{
  position:static;min-height:0;width:auto;padding:9px 0;margin-bottom:7px}
body.twocol .wrap.leftoff .lrail .railtab span{writing-mode:horizontal-tb}

/* ONE COLUMN (a phone): ordered by what you reach for, which is not the
   order the markup happens to be in — the content first, then the
   resources you spend during it, and the stats last. */
body.onecol .wrap,body.onecol .wrap.railoff,
body.onecol .wrap.leftoff,body.onecol .wrap.leftoff.railoff{grid-template-columns:1fr}
body.onecol .wrap>div:nth-child(2){order:1}
body.onecol .rrail{order:2}
body.onecol .lrail{order:3}
/* The vertical edge tab has nowhere to sit in a single column, so it
   becomes a full-width bar. Collapsing still works — which matters most
   here, where everything is stacked and the page is one long scroll. */
body.onecol .railtab{position:static;min-height:0;width:auto;padding:9px 0;margin-bottom:7px}
body.onecol .railtab span{writing-mode:horizontal-tb}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>

<script src="beasts-data.js"></script>
<script src="rules.js"></script>
<script src="calendar-data.js"></script>
<script src="cyrnn-data.js"></script>
<script src="combat-rules.js"></script>
<script src="app.js"></script>
<script src="combat.js"></script>
<script src="backup.js"></script>
<script>
/* Ask the worker that is actually controlling this page which build it
   is, so Settings can say so. Best-effort: no worker, or an old one that
   predates the message handler, simply leaves the readout alone. Called
   again whenever Settings opens, because the worker can change under a
   page that's been open a while. */
window.askSWVersion = function () {
  if (!("serviceWorker" in navigator) || typeof MessageChannel !== "function") return;
  navigator.serviceWorker.ready.then(function (reg) {
    var w = navigator.serviceWorker.controller || reg.active;
    if (!w) return;
    var ch = new MessageChannel();
    var timer = setTimeout(function () { ch.port1.close(); }, 3000);
    ch.port1.onmessage = function (ev) {
      clearTimeout(timer);
      if (typeof UI !== "undefined" && ev.data && ev.data !== UI.swVersion) {
        UI.swVersion = ev.data;
        if (UI.modal && UI.modal.type === "settings") render();
      }
    };
    w.postMessage("version", [ch.port2]);
  }).catch(function () {});
};

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function (e) {
      console.warn("Service worker registration failed:", e);
    });
    window.askSWVersion();
  });
}
</script>
</body>
</html>
